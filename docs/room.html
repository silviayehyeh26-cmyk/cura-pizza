<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>CURA Memory Room</title>


<style>


html,
body{

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#111;

    font-family:
    "Noto Sans TC",
    sans-serif;

}



#room-container{

    width:100%;

    height:100%;

}



canvas{

    display:block;

}




/* =====================
   Floating UI
===================== */


.room-header{


    position:fixed;

    top:0;

    left:0;

    width:100%;

    z-index:10;


    pointer-events:none;


}



.logo{


    margin:25px;


    color:white;


    font-size:32px;


    letter-spacing:6px;


    text-shadow:

    0 3px 15px rgba(0,0,0,.5);


}



.back-button{


    position:absolute;

    right:30px;

    top:25px;


    pointer-events:auto;


    border:none;


    padding:

    10px 20px;


    border-radius:30px;


    background:

    rgba(255,255,255,.2);


    color:white;


    cursor:pointer;


}



</style>


</head>



<body>

<!-- Interaction Hint -->

<div id="interaction-hint">

</div>

    <!-- Memory Card -->

<div id="memory-overlay">


<div id="memory-card">


<button id="memory-close">

✕

</button>


<h2 id="memory-title">

</h2>



<p id="memory-content">

</p>



</div>


</div>

<!-- ===================
     3D Space
=================== -->


<div id="room-container"></div>





<!-- ===================
     UI
=================== -->


<header class="room-header">


<div class="logo">

CURA

</div>



<button
class="back-button"
onclick="history.back()">

←

</button>

<link 
rel="stylesheet"
href="./css/interaction.css">

<link 
rel="stylesheet"
href="./css/memory-ui.css">

<link rel="stylesheet" href="./css/gallery-ui.css">

<link 
rel="stylesheet"
href="./css/gallery-buttons.css">

</header>





<script type="importmap">
{
  "imports": {
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
  }
}
</script>


<script type="module"
src="js/room-engine.js">
</script>

<!-- Gallery Overlay -->


<div id="gallery-overlay">


<div id="gallery-card">


<div id="gallery-icon">

</div>


<h1 id="gallery-title">

</h1>



<p id="gallery-description">

</p>



<button id="gallery-enter">

進入圖鑑

</button>


<button id="gallery-close">

返回房間

</button>


</div>


</div>

<!-- Gallery Page -->

<div id="gallery-page">

</div>

<div id="gallery-menu-panel">


<h2>
CURA Gallery
</h2>


<div id="gallery-list">

</div>


</div>

</body>


</html>
