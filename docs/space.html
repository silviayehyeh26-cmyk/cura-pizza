<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CURA Alive Story | Memory Space</title>

<link rel="stylesheet" href="css/space.css">

</head>


<body>


<!-- =========================
     Header
========================= -->

<header class="space-header">

    <div class="logo">
        CURA
    </div>




    <button class="menu-button">

        <span></span>
        <span></span>
        <span></span>

    </button>


</header>




<!-- =========================
     Hero
========================= -->

<section class="space-hero">


    <p class="subtitle">
        CURA ALIVE STORY
    </p>


    <h1>
        Choose Your<br>
        Memory Space
    </h1>


    <p class="description">

        Every story begins with a single door.

    </p>


</section>





<!-- =========================
     Door Selection
========================= -->


<section class="door-container">



<!-- =====================
 Old Pharmacy
===================== -->


<div class="memory-door old-pharmacy"
     data-room="old-pharmacy">


    <div class="door-frame">


        <div class="door-light"></div>


        <div class="door-panel">


            <div class="door-detail">

                <span></span>

            </div>


            <div class="door-handle"></div>


        </div>


    </div>



    <div class="door-title">

        <h2>
            Old Pharmacy
        </h2>

        <p>
            The Origin Memory
        </p>

    </div>


</div>







<!-- =====================
 Napoli
===================== -->


<div class="memory-door napoli"
     data-room="napoli">


    <div class="door-frame">


        <div class="door-light"></div>


        <div class="door-panel">


            <div class="arch-window">

            </div>


            <div class="door-handle"></div>


        </div>


    </div>



    <div class="door-title">

        <h2>
            Napoli
        </h2>


        <p>
            Craft & Tradition
        </p>

    </div>


</div>







<!-- =====================
 CURA Future
===================== -->


<div class="memory-door future"
     data-room="future">


    <div class="door-frame">


        <div class="door-light"></div>


        <div class="door-panel">


            <div class="future-line">

            </div>


            <div class="door-handle"></div>


        </div>


    </div>



    <div class="door-title">


        <h2>
            CURA Future
        </h2>


        <p>
            Memory Meets Intelligence
        </p>


    </div>



</div>



</section>







<!-- =========================
     Transition Layer
========================= -->


<div class="door-transition">

    <div class="transition-light"></div>


</div>







<script src="js/space.js"></script>


</body>


</html>
