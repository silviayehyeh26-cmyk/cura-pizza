<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>CURA Alive Story</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

height:100vh;

overflow:hidden;

background:#111;

font-family:
"Noto Sans TC",
sans-serif;

}



/* Camera */


#camera{

width:100%;

height:100%;

object-fit:cover;

}





/* Overlay */


.overlay{

position:fixed;

inset:0;

pointer-events:none;

}





.logo{


position:absolute;

top:30px;

left:30px;

color:white;

font-size:30px;

letter-spacing:5px;


}





.guide{


position:absolute;

top:90px;

left:30px;


color:white;


background:

rgba(0,0,0,.35);


padding:

10px 18px;


border-radius:20px;


}



.progress{


position:absolute;


top:150px;


left:30px;


color:white;


}



.progress span{


font-size:22px;


}




/* Scan Frame */


.scan-frame{


position:absolute;


top:50%;

left:50%;


transform:

translate(-50%,-50%);


width:260px;

height:260px;


border:

3px solid white;


border-radius:30px;


}





.message{


position:absolute;


bottom:120px;


width:100%;


text-align:center;


color:white;


font-size:18px;


}





.buttons{


position:absolute;


bottom:40px;


width:100%;


display:flex;


justify-content:center;


gap:15px;


pointer-events:auto;


}



button{


border:none;


padding:

14px 24px;


border-radius:30px;


font-size:16px;


cursor:pointer;


}




.owner{


background:#d8b38a;


}



.video{


background:white;


}



</style>


</head>



<body>



<video

id="camera"

autoplay

playsinline>

</video>





<div class="overlay">



<div class="logo">

CURA

</div>



<div class="guide">

知之 Ari · Memory Guide

</div>




<div class="progress">

歷史收集：

<span>

● ○ ○ ○

</span>

</div>



<div class="scan-frame">

</div>




<div class="message">

請掃描 CURA 記憶物件

</div>



<div class="buttons">


<button class="video">

📺 完整故事

</button>


<button 
id="bind-object"
class="owner">

＋ 綁定新物件

</button>


<button id="chat-button">

💬 詢問 Ari

</button>


</div>



<div id="chat-box"

style="

display:none;

position:absolute;

bottom:120px;

left:20px;

right:20px;

background:white;

padding:20px;

border-radius:20px;

color:#333;

">


<input

id="chat-input"

placeholder="詢問這件物品的故事..."

style="width:100%;padding:10px;"

>


<button

id="send-chat"

>

送出

</button>



<div id="chat-response">

</div>


</div>

</div>





<script type="module"

src="./js/scanner.js">

</script>



</body>

</html>
