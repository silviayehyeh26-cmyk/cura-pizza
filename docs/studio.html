<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
CURA Studio
</title>


<link rel="stylesheet" href="./css/studio.css">


</head>


<body>


<div class="studio">


<!-- ======================
     Header
====================== -->

<header class="studio-header">


<div class="brand">

CURA Studio

<span>
Memory Operating System
</span>

</div>


<div class="search-box">

🔍

<input 
placeholder="Search everything..."
>


</div>


</header>





<!-- ======================
     Main
====================== -->


<div class="studio-main">





<!-- ======================
     Sidebar
====================== -->


<aside class="sidebar">


<div class="sidebar-section">


<h3>
Workspace
</h3>





<button 
class="nav-item"
data-page="tags">

🏷

Tags

</button>



<button 
class="nav-item"
data-page="experiences">

◈

Experiences

</button>



<button 
class="nav-item"
data-page="npcs">

✦ AI NPCs

</button>

<button 
class="nav-item"
data-page="menus">

◫ 

Menus

</button>

<button 
class="nav-item"
data-page="assets">

▧

Assets

</button>



<button 
class="nav-item"
data-page="settings">

⚙

Settings

</button>



</div>







<div class="sidebar-section object-list">


<h3>
Objects
</h3>


<button 
class="new-button"
id="new-object">

＋ New Object

</button>

<div id="object-container">

</div>

</div>

<div class="sidebar-section collection-list">


<h3>
Collections
</h3>


<button class="new-button"
id="new-collection">


＋ New Collection

</button>


<div id="collection-container">


</div>


</div>

</aside>







<!-- ======================
     Editor
====================== -->

<section 
class="editor"
id="studio-content">


<div class="panel-title">

Object Editor

</div>



<div class="empty-editor">


<h2>

Select an object

</h2>


<p>

Choose a memory object from the left

</p>


</div>


</section>








<!-- ======================
     Preview
====================== -->


<section 
class="preview"
id="studio-preview">


<div class="panel-title">

Preview

</div>




<div class="preview-card">



<div class="preview-image">

📷

</div>



<h2>

店長相框

</h2>



<div class="guide">


Ari

</div>




<p>

「你好，我是 Ari。
<br>
這件物品保存著 CURA 的記憶。」

</p>



</div>



</section>






</div>





</div>





<script type="module"
src="./js/studio.js">
</script>


</body>

</html>
